{{- if and .Values.persistence.enabled (not .Values.persistence.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "claude-code-insights.fullname" . }}
  labels:
    {{- include "claude-code-insights.labels" . | nindent 4 }}
spec:
  # ReadWriteOnce on purpose: SQLite is single-writer and Azure Disks cannot
  # attach to multiple nodes; the app runs a single replica by design.
  accessModes:
    - ReadWriteOnce
  {{- with .Values.persistence.storageClassName }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size | quote }}
{{- end }}
